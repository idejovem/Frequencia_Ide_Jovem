  async function saveYoung(){

  async function loadYoungs(){

    const {
      data,
      error
    } = await supabaseClient
      .from('jovens')
      .select('*')
      .order('nome', { ascending: true });

    const list =
    document.getElementById('youngList');

    list.innerHTML='';

    if(error){

      list.innerHTML='Erro ao carregar';
      return;
    }

    if(data.length === 0){

      list.innerHTML='<p>Nenhum jovem cadastrado.</p>';
      return;
    }

    data.forEach(jovem=>{

      list.innerHTML += `

        <div class="young-item">

              ${jovem.nome}

            </button>

          <div class="small">
            ${jovem.whatsapp}
          </div>

        </div>

      `;
    });
  }


  // =========================
  // TIPO EVENTO
  // =========================

  function getEventType(){

    const now = new Date();

    const day = now.getDay();

    const date = now.getDate();

    const week = Math.ceil(date / 7);

    if(day === 3) return 'Quarta-feira';

    if(day === 5) return 'Sexta-feira';

    if(day === 0) return 'Domingo';

    if(day === 6 && week === 2)
    return '2º Sábado';

    if(day === 6 && week === 4)
    return '4º Sábado';

    return 'Evento Especial';
  }

async function loadAttendance(){

  const { data: jovens, error } =
  await supabaseClient
  .from('jovens')
  .select('*')
  .order('nome');

  const dateInput =
  document.getElementById('attendanceDate');

  // DEFINE HOJE APENAS 1 VEZ
  if(!dateInput.value){

    dateInput.value =
    new Date().toISOString().split('T')[0];
  }

  const selectedDate =
  dateInput.value;

  // BUSCAR PRESENÇAS DA DATA
  const { data: presencasHoje } =
  await supabaseClient
  .from('frequencia')
  .select('*')
  .gte('data_evento', selectedDate + 'T00:00:00')
  .lte('data_evento', selectedDate + 'T23:59:59');

  const list =
  document.getElementById('attendanceList');

  list.innerHTML='';

  const event = getEventType();

  document.getElementById('eventDate')
  .innerHTML =
  `${event} • ${
    new Date(selectedDate)
    .toLocaleDateString('pt-BR')
  }`;

  if(error){

    list.innerHTML='Erro ao carregar';
    return;
  }

  jovens.forEach(jovem=>{

   const registroExistente =
presencasHoje.find(
  p => p.jovem_id == jovem.id
);

const jaMarcado =
registroExistente !== undefined;
    list.innerHTML += `

      <div class="check-item ${jaMarcado ? 'disabled-check' : ''}">

        <span>
          ${jovem.nome}
          ${
  registroExistente
  ? (
      registroExistente.presente
      ? '✅'
      : '❌'
    )
  : ''
}
        </span>

        <input
          type="checkbox"
          class="check-presence"
          value="${jovem.id}"
          ${registroExistente?.presente ? 'checked' : ''}
${jaMarcado ? 'disabled' : ''}
        >

      </div>

    `;
  });
}  
// =========================
// CONFIRMAR CHAMADA
// =========================

async function confirmAttendance(){

  const checks =
  document.querySelectorAll('.check-presence');

  const event = getEventType();

  const selectedDate =
  document.getElementById('attendanceDate').value
  || new Date().toISOString().split('T')[0];

  let total = 0;

  for(const check of checks){

    // VERIFICAR SE JÁ EXISTE REGISTRO
    const { data: existente } =
    await supabaseClient
    .from('frequencia')
    .select('*')
    .eq('jovem_id', check.value)
    .gte('data_evento', selectedDate + 'T00:00:00')
    .lte('data_evento', selectedDate + 'T23:59:59');

    // SE JÁ EXISTIR, IGNORA
    if(existente.length > 0){
      continue;
    }

    // PRESENÇA
    const presente = check.checked;

    await supabaseClient
    .from('frequencia')
    .insert([
      {
        jovem_id: check.value,
        presente: presente,
        evento: event,
        data_evento:
        selectedDate + 'T12:00:00'
      }
    ]);

    total++;
  }

  alert(
    total > 0
    ? 'Chamada salva com sucesso'
    : 'Nenhuma alteração'
  );

  loadAttendance();
}

    : 0;

    ranking.push({
      nome: jovem.nome,
      percent,
      presentes,
      faltas,
      total
    });

    reportList.innerHTML += `

      <div class="report-item">

        <strong>${jovem.nome}</strong>

        <div class="bar">

          <div
            class="fill"
            style="width:${percent}%"
          ></div>

        </div>

        <div class="small">
          📈 ${percent}% de presença
        </div>

        <div class="small">
          ✅ ${presentes} presença(s)
        </div>

        <div class="small">
          ❌ ${faltas} falta(s)
        </div>

      </div>

    `;
  });

  
   // FALTAS SEGUIDAS
  let faltasSeguidasHTML = '';

  for(const jovem of jovens){

    const registros =
    frequencia
    .filter(f => f.jovem_id == jovem.id)
    .sort((a,b)=>
      new Date(a.data_evento) -
      new Date(b.data_evento)
    );

    let sequenciaAtual = 0;
    let maiorSequencia = 0;

    registros.forEach(r=>{

      if(r.presente === false){

        sequenciaAtual++;

        if(sequenciaAtual > maiorSequencia){
          maiorSequencia = sequenciaAtual;
        }

      }else{

        sequenciaAtual = 0;
      }
    });

    if(maiorSequencia >= 3){

      faltasSeguidasHTML += `

        <div class="small">

          ⚠️ ${jovem.nome}

          • ${maiorSequencia} faltas seguidas

        </div>

      `;
    }
  }

  if(faltasSeguidasHTML){

    absenceSequenceList.innerHTML = `

      <div class="report-item">

        <strong>
          🚨 Faltas Consecutivas
        </strong>

        <br><br>

        ${faltasSeguidasHTML}

      </div>

    `;
  }

  // MAIS FALTAS
  const faltosos =
  [...ranking]
  .sort((a,b)=>
    b.faltas - a.faltas
  );

   absenceSequenceList.innerHTML += `

<div class="report-item">

<strong>
⚠️ Quem Mais Faltou
</strong>

<br><br>

${faltosos.map((f,index)=>`

<div class="small">

${index + 1}º —
${f.nome}

• ${f.faltas} falta(s)

</div>

`).join('')}

</div>
`;
}
  
</script>

<script>

  // =========================
  // SERVICE WORKER PWA
  // =========================

  if ('serviceWorker' in navigator) {

    window.addEventListener('load', async () => {

      try {

        const registration =
        await navigator.serviceWorker.register('./sw.js');

        console.log(
          'Service Worker registrado:',
          registration
        );

      } catch (error) {

        console.log(
          'Erro Service Worker:',
          error
        );
      }

    });
  }


  // =========================
  // BOTÃO INSTALAR APP
  // =========================

  let deferredPrompt;

  window.addEventListener(
    'beforeinstallprompt',
    (e) => {

      e.preventDefault();

      deferredPrompt = e;

      showInstallButton();
    }
  );


  function showInstallButton(){

    if(document.getElementById('installAppBtn')){
      return;
    }

    const btn = document.createElement('button');

    btn.id = 'installAppBtn';

    btn.innerHTML = '📲 Instalar Aplicativo';

    btn.className = 'btn-main';

    btn.style.marginTop = '15px';

    btn.onclick = async () => {

      if(!deferredPrompt){
        return;
      }

      deferredPrompt.prompt();

      await deferredPrompt.userChoice;

      deferredPrompt = null;

      btn.remove();
    };

    const menuCard =
    document.querySelector('#menuScreen .card');

    menuCard.appendChild(btn);
  }


  // =========================
  // APP INSTALADO
  // =========================

  window.addEventListener(
    'appinstalled',
    () => {

      const btn =
      document.getElementById('installAppBtn');

      if(btn){
        btn.remove();
      }
    }
  );

</script>

<script>

  // =========================
  // ANIVERSARIANTES DO MÊS
  // =========================


async function loadBirthdays(){

  const { data, error } = await supabaseClient
    .from('jovens')
    .select('*')
    .order('nome', { ascending: true });

  const list =
  document.getElementById('birthList');

  list.innerHTML = '';

  if(error){

    list.innerHTML = 'Erro ao carregar';
    return;
  }

  // MÊS ATUAL
  const currentMonth =
  new Date().getMonth() + 1;

  // FILTRAR SOMENTE MÊS ATUAL
  const aniversariantes =
  data.filter(jovem => {

    if(!jovem.nascimento){
      return false;
    }

    // yyyy-mm-dd
    const partes =
    jovem.nascimento.split('-');

    const mes =
    parseInt(partes[1]);

    return mes === currentMonth;

  });

  // ORDENAR PELO DIA
  aniversariantes.sort((a,b)=>{

    const diaA =
    parseInt(a.nascimento.split('-')[2]);

    const diaB =
    parseInt(b.nascimento.split('-')[2]);

    return diaA - diaB;

  });

  if(aniversariantes.length === 0){

    list.innerHTML =
    '<p>Nenhum aniversariante este mês.</p>';

    return;
  }

  aniversariantes.forEach(jovem => {

    const partes =
    jovem.nascimento.split('-');

    const dia = partes[2];

    list.innerHTML += `

      <div class="young-item">

        <div class="young-name">
          🎉 ${jovem.nome}
        </div>

        <div class="small">
          Aniversário: ${dia}
        </div>

      </div>

    `;
  });
}

</script>
